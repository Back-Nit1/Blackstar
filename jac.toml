[project]
name = "blackstart"
version = "0.1.0"
description = "BLACKSTART - a self-healing microgrid controller for a military base"
entry-point = "main.jac"
kind = "fullstack"

# The headless sim and the test suite both rebuild the twin from scratch. If
# they share the served graph they fight the running server for the same
# SQLite anchors and you get a WriteConflict on exit. Give them their own
# session so `jac script sim` is safe to run while the web app is serving.
[environments.headless.run]
session = ".jac/headless.session"

[scripts]
sim = "jac run sim.jac --profile headless"
invariants = "jac test invariants.jac --profile headless"
data = "python3 glue/fetch_live_data.py"
web = "jac start --dev main.jac"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client]
